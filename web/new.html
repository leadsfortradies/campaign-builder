<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFT Campaign Builder — New campaign</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header>
  <a href="index.html" class="back-link">← All projects</a>
  <h1>New campaign</h1>
  <p class="muted">Starred fields are required. Everything else makes the ad copy better. Only list services the business actually offers.</p>
</header>
<main>
  <form id="new-form" class="new-form">
    <label>Business name *<input name="business_name" required></label>
    <label>Trade * <small>e.g. Painter, Deck builder, Concreter</small><input name="trade" required></label>
    <label>Services * <small>one per line, only what they actually do</small><textarea name="services" rows="4" required></textarea></label>
    <label>Service area * <small>one per line, e.g. Palmerston North, Feilding</small><textarea name="service_areas" rows="2" required></textarea></label>
    <label>Logo *<input type="file" name="logo" accept="image/*" required></label>
    <label>Scope notes <small>e.g. residential only, no roof painting</small><textarea name="scope_notes" rows="2"></textarea></label>
    <label>Years of experience<input name="years_experience" inputmode="numeric"></label>
    <label>Completed projects (estimate)<input name="completed_projects"></label>
    <label>Certifications / qualifications <small>one per line</small><textarea name="certifications" rows="2"></textarea></label>
    <label>Other reasons to choose them <small>guarantees, reviews and rating, awards, process</small><textarea name="other_info" rows="3"></textarea></label>
    <label>Phone<input name="business_phone" type="tel"></label>
    <label>Email<input name="business_email" type="email"></label>
    <label>Photos of completed work<input type="file" name="work_photos" accept="image/*" multiple></label>
    <label>Team / other photos<input type="file" name="team_photos" accept="image/*" multiple></label>
    <label class="check"><input type="checkbox" name="start_now" value="1" checked> Start keyword research straight away</label>
    <button type="submit" class="primary">Create campaign</button>
    <p id="form-msg" class="status-msg" hidden></p>
  </form>
</main>
<script src="js/model.js?v=1"></script>
<script>
document.getElementById("new-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector("button[type=submit]");
  const msg = document.getElementById("form-msg");
  const data = new FormData(form);
  if (!form.start_now.checked) data.set("start_now", "0");
  btn.disabled = true;
  btn.textContent = "Uploading…";
  try {
    const r = await fetch("/api/projects", { method: "POST", body: data });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
    location.href = `project.html?id=${encodeURIComponent(body.project_id)}`;
  } catch (err) {
    msg.textContent = "Couldn't create it: " + err.message;
    msg.className = "status-msg err";
    msg.hidden = false;
    btn.disabled = false;
    btn.textContent = "Create campaign";
  }
});
</script>
</body>
</html>
