<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFT Campaign Builder — New campaign</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header>
  <a href="index.html" class="back-link">← All projects</a>
  <h1 id="page-title">New campaign</h1>
  <p class="muted" id="intro">Starred fields are needed to start. Everything else makes the ad copy better. Only list services the business actually offers.</p>
</header>
<main>
  <form id="new-form" class="new-form">
    <label>Business name<input name="business_name"></label>
    <label>Trade <small>e.g. Painter, Deck builder, Concreter</small><input name="trade"></label>
    <label>Services * <small>one per line, only what they actually do</small><textarea name="services" rows="4" required></textarea></label>
    <label>Service area * <small>one per line, e.g. Palmerston North, Feilding</small><textarea name="service_areas" rows="2" required></textarea></label>
    <label>Logo <small>can be added later</small><input type="file" name="logo" accept="image/*"></label>
    <label>Scope notes <small>e.g. residential only, no roof painting</small><textarea name="scope_notes" rows="2"></textarea></label>
    <label>Years of experience<input name="years_experience" inputmode="numeric"></label>
    <label>Completed projects (estimate)<input name="completed_projects"></label>
    <label>Certifications / qualifications <small>one per line</small><textarea name="certifications" rows="2"></textarea></label>
    <label>Other reasons to choose them <small>guarantees, reviews and rating, awards, process</small><textarea name="other_info" rows="3"></textarea></label>
    <label>Phone<input name="business_phone" type="tel"></label>
    <label>Email<input name="business_email" type="email"></label>
    <label>Photos of completed work <small>images or a zip of them; big photos are shrunk in your browser before upload (max 150)</small><input type="file" name="work_photos" accept="image/*,.zip" multiple></label>
    <label>Team / other photos<input type="file" name="team_photos" accept="image/*,.zip" multiple></label>
    <label class="check" id="start-row"><input type="checkbox" name="start_now" value="1" checked> Start keyword research straight away</label>
    <button type="submit" class="primary">Create campaign</button>
    <p id="form-msg" class="status-msg" hidden></p>
  </form>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/model.js?v=1"></script>
<script>
const editId = new URLSearchParams(location.search).get("id");
const form = document.getElementById("new-form");
(async function setupEdit() {
  if (!editId) return;
  document.getElementById("page-title").textContent = "Business info";
  document.getElementById("intro").textContent =
    "Add or change anything here. Blank fields keep what's already saved, and any step that was waiting on missing info restarts when you update.";
  document.getElementById("start-row").hidden = true;
  form.querySelectorAll("[required]").forEach((el) => { el.required = false; });
  form.querySelector("button[type=submit]").textContent = "Update";
  document.querySelector(".back-link").href = `project.html?id=${encodeURIComponent(editId)}`;
  document.querySelector(".back-link").textContent = "← Back to project";
  try {
    const d = await (await fetch(`data/${encodeURIComponent(editId)}/step0.json`)).json();
    const set = (n, v) => { if (v && form[n]) form[n].value = Array.isArray(v) ? v.join("\n") : v; };
    ["business_name","trade","services","service_areas","scope_notes","years_experience",
     "completed_projects","certifications","other_info","business_phone","business_email"].forEach((n) => set(n, d[n]));
    const have = [];
    if (d.business_logo_path) have.push("logo saved");
    if ((d.work_photo_paths || []).length) have.push(`${d.work_photo_paths.length} work photos saved`);
    if ((d.team_photo_paths || []).length) have.push(`${d.team_photo_paths.length} team photos saved`);
    if (have.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "Already saved: " + have.join(", ") + ". New photos are added to these.";
      form.prepend(p);
    }
  } catch (e) { /* new/empty project */ }
})();

// ---- photo prep: unzip, fix rotation, shrink to 1600px JPEG before upload ----
const MAX_PHOTOS = 150, MAX_EDGE = 1600;
const IMG_RE = /\.(jpe?g|png|webp|avif|gif)$/i;

async function shrink(blob, name, keepPng) {
  let bmp;
  try { bmp = await createImageBitmap(blob, { imageOrientation: "from-image" }); }
  catch (e) { return null; }  // unreadable (e.g. HEIC): skipped, reported to the user
  const scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  const g = c.getContext("2d");
  if (!keepPng) { g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  const type = keepPng ? "image/png" : "image/jpeg";
  const out = await new Promise((r) => c.toBlob(r, type, 0.85));
  const base = name.replace(/^.*\//, "").replace(/\.[^.]+$/, "");
  return new File([out], base + (keepPng ? ".png" : ".jpg"), { type });
}

async function prepare(files, keepPng, say, skipped) {
  const out = [];
  for (const f of files) {
    if (out.length >= MAX_PHOTOS) { skipped.push(`${f.name} (over the ${MAX_PHOTOS} photo limit)`); continue; }
    if (/\.zip$/i.test(f.name)) {
      if (!window.JSZip) throw new Error("Couldn't load the zip reader; check your connection and try again.");
      say(`Opening ${f.name}…`);
      const zip = await JSZip.loadAsync(f);
      const entries = Object.values(zip.files).filter(
        (z) => !z.dir && IMG_RE.test(z.name) && !/(^|\/)(__MACOSX|\.)/.test(z.name));
      let n = 0;
      for (const z of entries) {
        if (out.length >= MAX_PHOTOS) { skipped.push(`${z.name} (over the ${MAX_PHOTOS} photo limit)`); continue; }
        say(`Shrinking ${f.name}: ${++n} of ${entries.length}`);
        const r = await shrink(await z.async("blob"), z.name, keepPng && /\.png$/i.test(z.name));
        r ? out.push(r) : skipped.push(z.name);
      }
    } else if (/\.svg$/i.test(f.name)) {
      out.push(f);
    } else {
      say(`Shrinking ${f.name}…`);
      const r = await shrink(f, f.name, keepPng && /\.(png|webp)$/i.test(f.name));
      r ? out.push(r) : skipped.push(f.name);
    }
  }
  return out;
}

document.getElementById("new-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector("button[type=submit]");
  const msg = document.getElementById("form-msg");
  const say = (t) => { msg.textContent = t; msg.className = "status-msg ok"; msg.hidden = false; };
  const idle = editId ? "Update" : "Create campaign";
  btn.disabled = true;
  btn.textContent = editId ? "Updating…" : "Working…";
  try {
    const data = new FormData(form);
    if (!editId && !form.start_now.checked) data.set("start_now", "0");
    const skipped = [];
    for (const [name, keepPng] of [["logo", true], ["work_photos", false], ["team_photos", false]]) {
      const files = [...form[name].files];
      data.delete(name);
      for (const f of await prepare(files, keepPng, say, skipped)) data.append(name, f, f.name);
    }
    if (skipped.length) {
      const go = confirm(`${skipped.length} file(s) will be left out (unreadable, or over the ${MAX_PHOTOS} photo limit):\n\n` +
        skipped.slice(0, 10).join("\n") + (skipped.length > 10 ? "\n…" : "") +
        "\n\n(HEIC photos need converting to JPG first.) Continue without them?");
      if (!go) { btn.disabled = false; btn.textContent = idle; msg.hidden = true; return; }
    }
    say("Uploading…");
    btn.textContent = "Uploading…";
    const url = editId ? `/api/projects/${encodeURIComponent(editId)}/info` : "/api/projects";
    const r = await fetch(url, { method: "POST", body: data });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
    location.href = `project.html?id=${encodeURIComponent(body.project_id || editId)}`;
  } catch (err) {
    msg.textContent = (editId ? "Couldn't update it: " : "Couldn't create it: ") + err.message;
    msg.className = "status-msg err";
    msg.hidden = false;
    btn.disabled = false;
    btn.textContent = idle;
  }
});
</script>
</body>
</html>
