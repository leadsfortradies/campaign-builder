<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFT Campaign Builder — Project</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header>
  <a href="index.html" class="back-link">← All projects</a>
  <h1 id="project-title">Loading…</h1>
  <p class="muted" id="info-line"></p>
  <nav class="tabs" id="tabs"></nav>
  <div class="toolbar" id="toolbar" hidden>
    <div class="counts" id="counts"></div>
    <div class="actions">
      <button id="reset-btn" class="secondary">Reset exclusions</button>
      <button id="export-btn" class="secondary">Export CSV</button>
      <button id="copy-btn" class="secondary">Copy</button>
      <button id="changes-btn" class="secondary">Ask for changes</button>
      <button id="approve-btn" class="primary">Approve this step →</button>
    </div>
  </div>
  <div id="changes-panel" hidden>
    <textarea id="changes-note" rows="3" placeholder="What should change? e.g. 'move X into the near-me group, drop anything mentioning gates'" style="width:100%;box-sizing:border-box;font:inherit;padding:8px"></textarea>
    <button id="changes-send" class="primary">Send changes</button>
  </div>
  <p id="status-msg" class="status-msg" hidden></p>
  <p id="job-msg" class="status-msg" hidden></p>
</header>

<main id="content"></main>

<script src="js/review.js?v=5"></script>
<script src="js/adcopy.js?v=5"></script>
<script src="js/landingpages.js?v=2"></script>
<script src="js/sitelinks.js?v=2"></script>
<script src="js/model.js?v=1"></script>
<script src="js/project.js?v=10"></script>
</body>
</html>
